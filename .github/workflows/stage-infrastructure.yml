name: Optional - Staging infrastructure

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Preview changes, or explicitly apply the reviewed staging infrastructure
        type: choice
        options: [preview, apply]
        default: preview
        required: true

permissions:
  contents: read

concurrency:
  group: staging-release
  cancel-in-progress: false

jobs:
  staging-infrastructure:
    name: Preview or apply staging resources
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: stage
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
      STAGE_PARAMETERS_FILE: hockey-stage-private/parameters.json
    steps:
      - name: Require a trusted main-branch invocation and Azure configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo 'Run deployments from main.' >&2; exit 1; }
          for variable in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP; do
            [[ -n "${!variable}" ]] || { echo "Missing GitHub variable: $variable" >&2; exit 1; }
          done

      - name: Check out the reviewed infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Bicep compiler
        run: az bicep install --version v0.48.1

      - name: Compile and validate private staging deployment parameters
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      LEGACY_WORKSPACE_ADMIN_USER_ID: ${{ vars.LEGACY_WORKSPACE_ADMIN_USER_ID }}
          SUPABASE_DATABASE_CONNECTION_STRING: ${{ secrets.SUPABASE_DATABASE_CONNECTION_STRING }}
        run: |
          umask 077
          mkdir -p artifacts/azure
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import subprocess
          from scripts.azure.supabase import validate_connection
          validate_connection(os.environ['SUPABASE_PROJECT_REF'], os.environ['SUPABASE_DATABASE_CONNECTION_STRING'], Path('backend'))
          parameters = Path(os.environ['RUNNER_TEMP']) / os.environ['STAGE_PARAMETERS_FILE']
          parameters.parent.mkdir(mode=0o700)
          subprocess.run(['az', 'bicep', 'build-params', '--file', 'iac/parameters/stage.bicepparam', '--outfile', str(parameters)], check=True)
          parameters.chmod(0o600)
          subprocess.run(['python3', 'scripts/azure/validate-environment-settings.py', 'stage', str(parameters)], check=True)
          PYTHON

      - name: Sign in to Azure with the staging deployment OIDC identity
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Check the available Linux .NET 10 runtime
        shell: bash
        run: |
          set -euo pipefail
          az webapp list-runtimes --os linux --output json > artifacts/azure/linux-runtimes.json
          python3 scripts/azure/check-dotnet-runtime.py

      - name: Preview the staging infrastructure changes
        shell: bash
        run: |
          set -euo pipefail
          az deployment group what-if \
            --name hockey-stage \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file iac/main.bicep \
            --result-format ResourceIdOnly \
            --parameters "@$RUNNER_TEMP/$STAGE_PARAMETERS_FILE"

      - name: Apply the staging infrastructure only when explicitly requested
        if: inputs.operation == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          az deployment group create \
            --name hockey-stage \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --mode Incremental \
            --template-file iac/main.bicep \
            --parameters "@$RUNNER_TEMP/$STAGE_PARAMETERS_FILE" \
            --query properties.outputs --output json

      - name: Remove private deployment parameters on success, failure, or cancellation
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/$STAGE_PARAMETERS_FILE"
