name: Optional - Preview staging database SQL

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-release
  cancel-in-progress: false

jobs:
  prepare-database:
    name: Review staging database migration SQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: stage
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require a main-branch invocation
        run: test "$GITHUB_REF" = refs/heads/main

      - name: Check out the migration artifact checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select the successful CI build for current main
        id: trusted_build
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/azure/verify-ci-run.py

      - name: Download its existing SQL artifact without regenerating migrations
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stage-app
          path: artifacts/stage-package
          run-id: ${{ steps.trusted_build.outputs.ci_run_id }}
          github-token: ${{ github.token }}

      - name: Match artifact metadata to the reviewed current main commit
        run: python3 scripts/azure/verify-database-release.py

      - name: Show the reviewed PostgreSQL migration and checksum without a database connection
        shell: bash
        run: |
          set -euo pipefail
          sha256sum artifacts/stage-package/postgresql.sql
          cat artifacts/stage-package/postgresql.sql
