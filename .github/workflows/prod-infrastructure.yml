name: Optional - Production-project infrastructure

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Validate, preview, or explicitly apply the temporary production-project infrastructure
        type: choice
        options: [validate, preview, apply]
        default: validate
        required: true

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  production-infrastructure:
    name: Validate, preview, or apply production-project resources
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: prod
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      LEGACY_WORKSPACE_ADMIN_USER_ID: ${{ vars.LEGACY_WORKSPACE_ADMIN_USER_ID }}
      PROD_PARAMETERS_FILE: hockey-prod-private/parameters.json
    steps:
      - name: Require main and a separate production resource group
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo 'Run production preparation from main.' >&2; exit 1; }
          [[ "$AZURE_RESOURCE_GROUP" == 'rg-hockey-prod' ]] || { echo 'AZURE_RESOURCE_GROUP must be rg-hockey-prod.' >&2; exit 1; }
          for variable in AZURE_WEBAPP_NAME SUPABASE_PROJECT_REF SUPABASE_URL SUPABASE_PUBLISHABLE_KEY; do
            [[ -n "${!variable}" ]] || { echo "Missing prod environment setting: $variable" >&2; exit 1; }
          done

      - name: Check out reviewed production preparation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Bicep compiler
        run: az bicep install --version v0.48.1

      - name: Validate the separate Supabase project, certificate, and private production parameters
        shell: bash
        env:
          SUPABASE_DATABASE_CONNECTION_STRING: ${{ secrets.SUPABASE_DATABASE_CONNECTION_STRING }}
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$SUPABASE_DATABASE_CONNECTION_STRING" ]] || { echo 'Missing prod environment secret: SUPABASE_DATABASE_CONNECTION_STRING' >&2; exit 1; }
          test -f backend/Certificates/supabase-prod-root.crt
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import subprocess
          from scripts.azure.supabase import validate_connection

          validate_connection(
              os.environ['SUPABASE_PROJECT_REF'],
              os.environ['SUPABASE_DATABASE_CONNECTION_STRING'],
              Path('backend'),
              environment='prod',
          )
          parameters = Path(os.environ['RUNNER_TEMP']) / os.environ['PROD_PARAMETERS_FILE']
          parameters.parent.mkdir(mode=0o700)
          subprocess.run([
              'az', 'bicep', 'build-params', '--file', 'iac/parameters/prod.bicepparam',
              '--outfile', str(parameters),
          ], check=True)
          parameters.chmod(0o600)
          subprocess.run([
              'python3', 'scripts/azure/validate-environment-settings.py', 'prod', str(parameters),
          ], check=True)
          PYTHON

      - name: Require Azure configuration for preview or apply
        if: inputs.operation != 'validate'
        shell: bash
        run: |
          set -euo pipefail
          for variable in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            [[ -n "${!variable}" ]] || { echo "Missing prod environment setting: $variable" >&2; exit 1; }
          done

      - name: Sign in to Azure with the production-project deployment identity
        if: inputs.operation != 'validate'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Check the available Linux .NET 10 runtime
        if: inputs.operation != 'validate'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/azure
          az webapp list-runtimes --os linux --output json > artifacts/azure/linux-runtimes.json
          python3 scripts/azure/check-dotnet-runtime.py

      - name: Preview production-project infrastructure changes
        if: inputs.operation != 'validate'
        shell: bash
        run: |
          set -euo pipefail
          az deployment group what-if \
            --name hockey-prod \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file iac/main.bicep \
            --result-format ResourceIdOnly \
            --parameters "@$RUNNER_TEMP/$PROD_PARAMETERS_FILE"

      - name: Apply production-project infrastructure only when explicitly requested
        if: inputs.operation == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          az deployment group create \
            --name hockey-prod \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --mode Incremental \
            --template-file iac/main.bicep \
            --parameters "@$RUNNER_TEMP/$PROD_PARAMETERS_FILE" \
            --query properties.outputs --output json

      - name: Remove private parameters on success, failure, or cancellation
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/$PROD_PARAMETERS_FILE"
