name: Deploy application template

on:
  workflow_call:
    inputs:
      environment:
        description: Destination GitHub environment
        type: string
        required: true
      release:
        description: Verified build identity selected by the release workflow
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Migrate, deploy, and verify ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      HOCKEY_DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      SELECTED_RELEASE_JSON: ${{ inputs.release }}
      RELEASE_COMMIT: ${{ fromJSON(inputs.release).commit }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Require a trusted main-branch invocation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo 'Run deployments from main.' >&2; exit 1; }

      - name: Require separate production targets
        if: inputs.environment == 'prod'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AZURE_RESOURCE_GROUP" == 'rg-hockey-prod' && "$AZURE_WEBAPP_NAME" == *-prod ]] || {
            echo 'Production must target its separate resource group and web app.' >&2; exit 1;
          }
          [[ "$SUPABASE_PROJECT_REF" != 'wbnjumvxvxwvbimqjccu' && "$SUPABASE_URL" == "https://$SUPABASE_PROJECT_REF.supabase.co" ]] || {
            echo 'Production must target its separate Supabase project.' >&2; exit 1;
          }

      - name: Check out deployment checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the current application prerequisites
        run: python3 "scripts/azure/check-$HOCKEY_DEPLOY_ENVIRONMENT-readiness.py"

      - name: Download the selected immutable application package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ fromJSON(inputs.release).artifactId }}
          run-id: ${{ fromJSON(inputs.release).ciRunId }}
          path: artifacts/application
          github-token: ${{ github.token }}
          digest-mismatch: error

      - name: Verify package provenance, SQL, and packaged readiness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/azure/release.py verify-package
          report=application-readiness.json
          if [[ "$HOCKEY_DEPLOY_ENVIRONMENT" == prod ]]; then report=prod-application-readiness.json; fi
          python3 "scripts/azure/check-$HOCKEY_DEPLOY_ENVIRONMENT-readiness.py" "artifacts/application/$report"

      - name: Sign in to Azure with the environment deployment OIDC identity
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify public access was deliberately enabled before deployment
        shell: bash
        run: |
          set -euo pipefail
          access=$(az webapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --query publicNetworkAccess --output tsv)
          [[ "$access" == 'Enabled' ]] || { echo 'The destination site is still closed. Follow the readiness steps in docs/azure-deployment.md.' >&2; exit 1; }

      - name: Validate the Supabase project connection and TLS
        env:
          SUPABASE_DATABASE_CONNECTION_STRING: ${{ secrets.SUPABASE_DATABASE_CONNECTION_STRING }}
        run: |
          python3 scripts/azure/supabase.py
          test -f artifacts/application/efbundle
          test -f "artifacts/application/Certificates/supabase-$HOCKEY_DEPLOY_ENVIRONMENT-root.crt"

      - name: Stop the app for the maintenance window
        id: maintenance
        shell: bash
        run: |
          set -euo pipefail
          az webapp stop --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME"
          for attempt in {1..12}; do
            state=$(az webapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --query state --output tsv)
            [[ "$state" == 'Stopped' ]] && exit 0
            sleep 5
          done
          echo 'App did not reach Stopped state; refusing to change schema.' >&2
          exit 1

      - name: Apply reviewed PostgreSQL migrations while the app is stopped
        shell: bash
        env:
          ConnectionStrings__Hockey: ${{ secrets.SUPABASE_DATABASE_CONNECTION_STRING }}
          Database__Provider: PostgreSql
          ASPNETCORE_ENVIRONMENT: ${{ inputs.environment == 'prod' && 'Production' || 'Staging' }}
        run: |
          set -euo pipefail
          chmod +x artifacts/application/efbundle
          cd artifacts/application
          ./efbundle

      - name: Deploy the tested app without restarting before migration/deployment succeeds
        shell: bash
        run: |
          set -euo pipefail
          az webapp deploy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --type zip \
            --src-path artifacts/application/app.zip \
            --clean true \
            --restart false \
            --track-status false
          az webapp start --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME"

      - name: Refresh App Service Key Vault references before smoke checks
        shell: bash
        run: |
          set -euo pipefail
          app_id=$(az webapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --query id --output tsv)
          az rest --method post --uri "https://management.azure.com$app_id/config/configreferences/appsettings/refresh?api-version=2022-03-01" --output none

      - name: Smoke-test process health, database readiness, Auth configuration, and React
        shell: bash
        run: |
          set -euo pipefail
          host=$(az webapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --query defaultHostName --output tsv)
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 "https://$host/api/health"
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 "https://$host/api/readiness"
          auth_config=$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 "https://$host/api/auth/config")
          AUTH_CONFIG_JSON="$auth_config" python3 - <<'PY'
          import json
          import os

          config = json.loads(os.environ['AUTH_CONFIG_JSON'])
          if (config.get('enabled') is not True
                  or config.get('supabaseUrl') != os.environ['SUPABASE_URL']
                  or config.get('publishableKey') != os.environ['SUPABASE_PUBLISHABLE_KEY']):
              raise SystemExit('The app is not serving the expected Supabase Auth configuration.')
          PY
          anonymous_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "https://$host/api/drills")
          [[ "$anonymous_status" == '401' ]] || { echo 'Anonymous drill access must return 401.' >&2; exit 1; }
          curl --fail --silent --show-error "https://$host/" | grep -F 'id="root"'

      - name: Record the verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/azure/release.py record

      - name: Save the verified release record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.environment }}-release
          path: artifacts/${{ inputs.environment }}-release.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      - name: Summarise deployment and verification
        shell: bash
        run: |
          host=$(az webapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --query defaultHostName --output tsv)
          {
            echo "## Deployed to $HOCKEY_DEPLOY_ENVIRONMENT"
            echo
            printf -- '- Commit: `%s`\n' "$RELEASE_COMMIT"
            echo "- Application: https://$host"
            echo '- Database migrations: succeeded (no changes when already current).'
            echo '- Health, database readiness, Auth configuration, anonymous access, and React: passed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the app stopped when a release fails after entering maintenance
        if: (failure() || cancelled()) && steps.maintenance.outcome == 'success'
        run: az webapp stop --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME"
